<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShippoBot Control Panel 🐾</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: #eee;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #ff77e9;
      text-align: center;
    }
    input, select, button {
      padding: 0.6rem;
      margin-top: 0.5rem;
      width: 100%;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }
    input, select {
      background: #222;
      color: #eee;
    }
    button {
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }
    button.launch {
      background: #ff77e9;
      color: black;
    }
    button.reset {
      background: #444;
      color: white;
    }
    label {
      margin-top: 1.2rem;
      display: block;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #log {
      margin-top: 2rem;
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-line;
      font-family: monospace;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>🖤 ShippoBot Setup Panel 🐾</h1>

  <form id="configForm" autocomplete="off">
    <label>
      Twitch Username
      <input type="text" id="twitchUsername" placeholder="e.g. bulletstormbunny" required autocomplete="off" />
    </label>

    <label>
      Twitch OAuth Token
      <input type="text" id="twitchOauth" placeholder="oauth:xxxxxxxxxxxx" required autocomplete="off" />
    </label>

    <label>
      Channel to Join
      <input type="text" id="twitchChannel" placeholder="channel name (usually same as username)" required autocomplete="off" />
    </label>

    <label>
      OpenAI API Key (optional)
      <input type="text" id="openaiKey" placeholder="sk-xxxxxxxx" autocomplete="off" />
    </label>

    <label>
      AI Mode
      <select id="aiMode">
        <option value="llama3">🦙 LLaMA3 (local)</option>
        <option value="openai">🤖 OpenAI (cloud)</option>
        <option value="hybrid" selected>⚡ Hybrid (try LLaMA3, fallback to OpenAI)</option>
      </select>
    </label>

    <label class="checkbox-label" title="Stores your bot config locally in this browser only.">
      <input type="checkbox" id="saveCreds" checked />
      Save credentials locally
    </label>

    <button type="submit" class="launch">🚀 Launch ShippoBot</button>
    <button type="button" class="reset" id="resetBtn">🧹 Reset Config</button>
  </form>

  <div id="log">✨ Log output will appear here...</div>

  <script>
    const form = document.getElementById('configForm');
    const log = document.getElementById('log');
    const resetBtn = document.getElementById('resetBtn');
    const saveCreds = document.getElementById('saveCreds');

    const fields = {
      twitchUsername: 'input',
      twitchOauth: 'input',
      twitchChannel: 'input',
      openaiKey: 'input',
      aiMode: 'select'
    };

    // 🧠 Restore from localStorage
    window.addEventListener('DOMContentLoaded', () => {
      if (saveCreds.checked) {
        for (const [id, type] of Object.entries(fields)) {
          const saved = localStorage.getItem(id);
          if (saved !== null) {
            const el = document.getElementById(id);
            if (el) el.value = saved;
          }
        }
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const config = {
        username: document.getElementById('twitchUsername').value.trim(),
        oauth: document.getElementById('twitchOauth').value.trim(),
        channel: document.getElementById('twitchChannel').value.trim(),
        openai: document.getElementById('openaiKey').value.trim(),
        aiMode: document.getElementById('aiMode').value
      };

      // 💾 Save to localStorage
      if (saveCreds.checked) {
        for (const id of Object.keys(fields)) {
          const el = document.getElementById(id);
          if (el) localStorage.setItem(id, el.value.trim());
        }
      }

      log.textContent = "🧠 Sending your vibes to the bot dimension...";

      try {
        const res = await fetch('/start-bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
        const text = await res.text();
        log.textContent = res.ok ? `✅ ${text}` : `❌ ${text}`;
      } catch (err) {
        console.error(err);
        log.textContent = `💥 Bot boot error: ${err.message}`;
      }
    });

    // 🧹 Reset config
    resetBtn.addEventListener('click', () => {
      for (const id of Object.keys(fields)) {
        localStorage.removeItem(id);
        const el = document.getElementById(id);
        if (el) el.value = '';
      }
      log.textContent = "🧼 Local config cleared.";
    });
  </script>
</body>
</html>
