<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShippoBot Control Panel 🐾</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: #eee;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #ff77e9;
      text-align: center;
    }
    input, button {
      padding: 0.6rem;
      margin-top: 0.5rem;
      width: 100%;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }
    input {
      background: #222;
      color: #eee;
    }
    button {
      background: #ff77e9;
      color: black;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    label {
      margin-top: 1.2rem;
      display: block;
    }
    #log {
      margin-top: 2rem;
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-line;
      font-family: monospace;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>🖤 ShippoBot Setup Panel 🐾</h1>

  <form id="configForm">
    <label>
      Twitch Username
      <input type="text" id="twitchUsername" placeholder="e.g. bulletstormbunny" required />
    </label>

    <label>
      Twitch OAuth Token
      <input type="text" id="twitchOauth" placeholder="oauth:xxxxxxxxxxxx" required />
    </label>

    <label>
      Channel to Join
      <input type="text" id="twitchChannel" placeholder="channel name (usually same as username)" required />
    </label>

    <label>
      OpenAI API Key (optional)
      <input type="text" id="openaiKey" placeholder="sk-xxxxxxxx" />
    </label>

    <button type="submit">🚀 Launch ShippoBot</button>
  </form>

  <div id="log">✨ Log output will appear here...</div>

  <script>
    const form = document.getElementById('configForm');
    const log = document.getElementById('log');

    // 🧠 Restore from localStorage
    ['twitchUsername', 'twitchOauth', 'twitchChannel', 'openaiKey'].forEach(id => {
      const saved = localStorage.getItem(id);
      if (saved) document.getElementById(id).value = saved;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const config = {
        username: document.getElementById('twitchUsername').value.trim(),
        oauth: document.getElementById('twitchOauth').value.trim(),
        channel: document.getElementById('twitchChannel').value.trim(),
        openai: document.getElementById('openaiKey').value.trim()
      };

      // 💾 Save inputs
      for (const key in config) {
        localStorage.setItem(`twitch${key.charAt(0).toUpperCase() + key.slice(1)}`, config[key]);
      }

      log.textContent = "🧠 Sending your vibes to the bot dimension...";

      try {
        const res = await fetch('/start-bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
        const text = await res.text();
        log.textContent = res.ok ? `✅ ${text}` : `❌ ${text}`;
      } catch (err) {
        console.error(err);
        log.textContent = `💥 Bot boot error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
